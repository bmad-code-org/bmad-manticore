# Default studio configuration for BMad Manticore, in full. mc-setup reads
# these defaults, interviews the creator, and writes the result to
# [modules.manticore] in {project-root}/_bmad/custom/config.toml
# (personal overrides go in config.user.toml next to it; resolve with
# {project-root}/_bmad/scripts/resolve_config.py --key modules.manticore).
#
# This file is the authority on the schema and on every default in it.
# API keys NEVER go in any TOML; only the names of env vars that hold them.

# --- Studio defaults: the seed values for [modules.manticore] -------------

[defaults]

config-version = 1

[defaults.owner]

# Your name as skills should address you, and the channel/brand name.
name = ""
channel = ""
# Measured speaking rate in words per minute, for script runtime estimates.
# Measure from a real transcript; on-camera educators often run 180+.
wpm = 145
# Links appended to video descriptions, in order. Plain URLs or "Label: URL".
links = []

[defaults.paths]

# Where your studio data lives, relative to project root unless absolute.
# brand-path holds tokens.json, production-bible.md, voice-bible.md, blacklist.md,
# craft-checklist.md, exemplars/, headshots/.
brand-path = "manticore/brand"
# formats-path holds your editable format profiles (learnings accumulate there).
formats-path = "manticore/formats"
# projects-path holds one folder per video.
projects-path = "manticore/projects"
# engines-path holds your HyperFrames engine workspaces.
engines-path = "manticore/engines"

[defaults.video]

record-resolution = "3840x2160"
delivery-resolution = "1920x1080"
fps = 30

[defaults.render]

# Manticore renders by default: a fast low-res preview after every cutplan or
# beats approval, and an offered final-quality render at gate 4. The editor
# timeline export and all assets (edl.json, cutplan.md, overlays) are ALWAYS
# produced alongside, so you can jump into your editor at any step. The
# creator confirms this default during setup.
self-render = true
# Preview render: small and fast, for iteration.
preview-height = 720
preview-crf = 28
# Final render: delivery quality, produced only on the gate-4 offer.
final-codec = "h264"
final-crf = 18
# Two-pass ffmpeg loudnorm on the final render only; the fast preview is
# never normalized. Set false to skip normalization entirely.
loudnorm = true
# Integrated LUFS target for the final render; -14 is the YouTube reference.
# TP -1.5 / LRA 11 are fixed in the script.
loudness-target = -14

[defaults.style]

# Graphics-frequency tier: how often a graphic beat lands, on a front-loaded
# pacing curve (denser early). Tiers:
#   "high"    a beat roughly every 10 to 20 seconds
#   "medium"  a beat roughly every 20 to 45 seconds
#   "low"     a beat roughly every 45 to 90 seconds
# Interviewed at setup; a format profile's frontmatter overrides the tier for
# that format, and the Production Bible mirrors the resolved value.
graphics-frequency = "medium"

[defaults.cta]

# CTA appetite and inventory, interviewed at setup and mirrored in the
# Production Bible's CTA section.
appetite = "moderate"        # aggressive | moderate | minimal

[[defaults.cta.items]]
kind = "subscribe"           # subscribe | community | support | product | next-video | playlist | site
label = ""
url = ""
asset = ""                   # optional path under {brand-path} (e.g. a lower-third card)
priority = 1

[defaults.live]

# Live production tool, for the stream-pack lane. Values: "obs" | "ecamm" | "other".
# OBS gets HTML browser sources and WebM stingers; ecamm/other get baked
# PNG / ProRes alpha scenes and a tool-specific HANDOFF.md.
tool = "obs"

[defaults.editor]

# Your NLE. Known values: "resolve", "fcp", "premiere", "descript", "other".
name = "resolve"
# Timeline format the cut stage exports for your editor.
#   "fcpxml"  DaVinci Resolve, Final Cut Pro (implemented first)
#   "xmeml"   Premiere Pro (planned; FCP7-style XML)
#   "edl"     CMX3600, the universal fallback (planned)
#   "none"    skip timeline export; you get edl.json + cutplan.md + preview.mp4
#             and cut manually in your editor (Descript and others)
timeline-format = "fcpxml"
# DaVinci Resolve lane: read only when name = "resolve". Needs DaVinci Resolve
# Studio running with Preferences > System > General > External scripting
# using: Local; the free edition refuses scripts and stays on the fcpxml lane.
# Every name below is one you create in Resolve; a name Resolve does not list
# fails mc-setup's check rather than being swapped for another.
# Project settings preset applied to each new video's Resolve project.
# "" means Resolve's default settings, said aloud when the project is created.
resolve-project-preset = ""
# Render preset for the gate 4 final render. "" means "H.264 Master", said
# aloud at render time.
resolve-render-preset = ""
# Loudness normalization before the final render: a mode Resolve lists in
# its Normalize Audio Levels modes ("YouTube", "EBU R128", ...). "" skips
# normalization, said aloud at render time.
resolve-loudness = "YouTube"
# Fairlight preset applied before the final render. "" applies none.
resolve-fairlight-preset = ""
# Fusion title used for text graphics on the Resolve lane, editable in
# Resolve or through Blackmagic's MCP. "" turns Fusion titles off and text
# graphics stay baked alpha.
resolve-title-template = "Text+"

[defaults.transcription]

# Word-level transcription for the cut stage. Options:
#   "auto"             the default: picks parakeet-mlx on macOS Apple Silicon
#                      and onnx-asr everywhere else. Both lanes are free +
#                      local and run the same parakeet-tdt-0.6b-v3 weights.
#   "parakeet-mlx"     the reference lane: Apple Silicon ONLY, word
#                      timestamps, verbatim fillers preserved (validated on
#                      real footage 2026-07-05; model parakeet-tdt-0.6b-v3)
#   "onnx-asr"         the cross-platform lane (implemented): Windows, Linux,
#                      and Intel Mac, same parakeet-tdt-0.6b-v3 weights as an
#                      ONNX conversion, so verbatim fillers and word
#                      timestamps carry over. CPU by default; CUDA machines
#                      escalate with uv run --with "onnx-asr[gpu,hub]"
#                      python <script-path> (the python command is required:
#                      it skips the script's cpu-extra dependency so
#                      onnxruntime-gpu never co-installs with onnxruntime).
#   "elevenlabs-scribe" / "deepgram-nova3"  metered API lanes (planned;
#                      opt-in only, chosen explicitly during setup)
provider = "auto"
# Env var holding the key for a metered provider. Leave blank for local lanes;
# set only when choosing a metered provider.
api-key-env = ""

[defaults.assets]

# Generation lanes for mc-assets. Set during setup: a registered [[tools]]
# CLI entry (a subscription you already pay for) is the preferred lane; a
# metered API provider ("xai-api", "veo-api") only as an explicit opt-in
# choice. Empty means unset: mc-assets stops and asks rather than bill by
# default.
image-provider = ""
video-provider = ""
escalation-provider = ""
# Env var names for the metered API lanes. Ship blank, like
# [defaults.transcription] api-key-env: tool registration fills the vendor's
# key name only when you explicitly opt into that metered lane, and key
# sourcing is discussed only inside that opt-in branch.
xai-api-key-env = ""
gemini-api-key-env = ""

[defaults.audio]

# Audio generation lanes for the mc-audio service skill (it farms sound the
# way mc-assets farms pictures; called from graphics, stream-pack, and the
# voiceover-explainer format, never a pipeline stage). Local-first ladder,
# validated end to end 2026-07-07 on Apple Silicon. Lanes:
#   tts-provider:
#     "kokoro-local"   the default: Kokoro-82M via kokoro-onnx, free + local,
#                      ~6.6x realtime on CPU. Single-voice narration and the
#                      two-host dialogue recipe. Fixed voice set: no cloning,
#                      so narration is stock voices, never "your voice".
#     "gemini-tts"     cheap cloud two-host lane (planned; opt-in only)
#     "elevenlabs-dialogue"  premium multi-speaker (planned; opt-in only)
#   music-provider:
#     "musicgen-local" the default: facebook/musicgen-small, ungated, free +
#                      local. Instrumental beds and stingers only, no vocals.
#     "stable-audio-open"  HF-gated behind a license click-through, so never
#                      the default; opt-in only (planned)
#     "eleven-music"   paid opt-in (planned)
#   sfx-provider:
#     "audioldm2-local"  the default: cvssp/audioldm2, ungated, free + local.
#                      16 kHz output: fine under a mix, thin exposed solo.
#   song-provider (full songs with vocals):
#     ""               the shipped state: no validated local lane yet.
#                      ACE-Step is the planned candidate (MIT, ungated, MLX
#                      on Mac), NOT validated; mc-audio never promises it.
tts-provider = "kokoro-local"
music-provider = "musicgen-local"
sfx-provider = "audioldm2-local"
song-provider = ""
# Env var for a paid audio lane's key. Ships blank; set only inside the
# explicit opt-in branch of the interview.
api-key-env = ""
# Engine workspace name under [paths] engines-path: one persistent venv
# (with the critical diffusers==0.31.0 + transformers==4.43.4 pin) plus
# model caches for all three local engines. mc-audio's ensure_workspace.py
# builds it with consent; an existing lab is reused, never duplicated.
workspace = "audio-lab"

[defaults.mcp]

# MCP servers mc-setup has verified in this project. Skills treat false/absent
# as "not available" and fall back gracefully.
# davinci-resolve: Blackmagic's own MCP server (DaVinci Resolve Studio 21.1+,
# set up from File > Setup AI Assistants inside Resolve) is configured for
# this project. It serves the creator's interactive work in Resolve; no
# pipeline stage needs it, because the Resolve lane drives the scripting API
# directly.
davinci-resolve = false

[defaults.cut]

# Silence floor in dBFS for analyze_audio.py, passed as --noise at step 3a.
# This is NOT taste and NOT a universal: it is a property of the creator's
# room and mic. Room tone on a decent mic sits well under -30; a noisy room
# needs -35 or -40. It matters more than it looks, because the audio map is
# the timing source of truth for the whole stage AND the input to the
# transcript completeness gate: set it too high and almost nothing registers
# as silent, which starves the cutter and makes the gate misbehave.
#
# Note this is the FLOOR (what counts as silent), not the map resolution.
# analyze_audio's --map-granularity is deliberately not exposed: the
# calibration record establishes it must stay finer than every consumer, so
# it is a mechanic, not a knob.
silence-floor-db = -30.0

# Extra flags appended to the cutplan.py invocation. Empty means the script
# defaults: min-silence 0.30, keep-ms 200, retake window 16, run 3,
# section-run 8, section-window-s 45.
#
# NOTE: cutplan.py REFUSES (exit 2) when -o, --audio-map or --voice-bible
# appear twice, so this string cannot redirect the output or swap the timing
# source of truth. The boundary below is enforced, not just documented.
#
# Pacing (the two that change how the edit FEELS):
#   --min-silence 0.30  interior silences shorter than this are the
#                       speaker's rhythm and are left completely alone.
#                       Raise it for a slower, more deliberate read.
#   --keep-ms 200       breathing room kept inside each tightened silence.
#                       Lower is tighter; 0 is machine-gunned, don't.
#
# Section re-reads (--section-run, --section-window-s): how long a repeated
# run must be, and how close in TIME, to count as a redo rather than a
# deliberate callback. Widen the window for a rambling delivery.
#
# Interview sources: --marker-cues overrides the default cue "question from
# the interviewer" (pass --marker-cues "question from claude" for projects
# recorded against the older convention). mc-setup's marker-cue interview
# question records a non-default cue here.
#
# --blooper-cues overrides the expletive/reset vocabulary; per-creator, so
# set it here when the shipped vocabulary misses.
#
# Note: --audio-map and --voice-bible are passed by the SKILL (resolved
# paths), not from this file.
cutplan-flags = ""

# ESCAPE HATCH for render flags the studio config does not model, e.g.
# "--segment-target-seconds 300". Encoder settings have ONE home and it is not
# here: preview-height, preview-crf, final-crf, loudnorm and loudness-target
# live in [render] / [video], and the skill emits those first with this
# string appended last. Because the last occurrence wins, restating a key
# [render] owns here silently overrides it, and which value applies then
# depends on emission order rather than on any stated rule. So do not put
# --height, --crf, or the loudness flags in these.
preview-flags = ""
final-flags = ""

[defaults.packaging]

# Title+thumbnail candidates to present (series projects present them as
# exactly this many A/B pairs).
candidates = 3

# Hard cap on on-image thumbnail hook words (face-plus-hook convention).
hook-words-max = 4

# Title length cap in characters (front-load what matters; longer gets cut
# off in feeds).
title-max-chars = 60

# Proof width in pixels for the mandatory downscale verification
# (verify_thumb.py). 120 approximates the smallest feed rendering.
verify-width = 120

[defaults.retro]

# Path globs, relative to the project folder, that the wrap lane must
# never list for reclaim (in addition to the built-in never-reclaim set:
# source footage, transcripts, edl.json, cutplan, overlays, project.json,
# and the published master).
preserve = []

# --- CLI tool registry ----------------------------------------------------
# The creator's [[tools]] entries are written into [modules.manticore] by
# mc-setup, one block per agentic/generation CLI. The `notes` field is the
# persistent memory: everything a skill needs to drive the tool correctly.
#
# The `headless` template is parsed with POSIX shell quoting on every OS
# (single/double quotes as in a POSIX shell, backslash escapes; prefer
# forward slashes in template paths). The tool name (argv[0]) is resolved
# with a PATH lookup at run time, so npm-installed tools may be registered
# by bare name on Windows too (.cmd/.exe shims are found via PATH+PATHEXT).
#
# [[modules.manticore.tools]]
# name = "grok"
# capabilities = ["image", "video", "x"]     # Imagine image + video gen, X/Twitter access
# headless = 'grok -p "<prompt>" --always-approve'
# models = []                                # your preferred models, if the tool takes them
# notes = """
# Imagine image and video gen (image-to-video, 720p, native audio). Cinematic
# bias. Also the lane for X/Twitter research and posting. Never use for UI or
# readable on-screen text; text renders as gibberish.
# """
#
# [[modules.manticore.tools]]
# name = "agy"
# capabilities = ["image"]                   # Gemini image gen on plan quota
# headless = 'agy -p "<prompt>" --dangerously-skip-permissions'
# notes = """
# Gemini image gen, literal/illustrative style. Draws on plan quota, no
# per-image billing.
# """
